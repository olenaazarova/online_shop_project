version: '3.9'

services:

  items-service:
    build: ./items-service
    ports:
      - "8000:8000"
    depends_on:
      - mongo1
      - rabbitmq

  search-service:
    build: ./search-service
    ports:
      - "8001:8001"
    depends_on:
      - mongo1
      - rabbitmq
      - redis

  mongo1:
    image: mongo:7
    container_name: mongo1
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo1_data:/data/db

  mongo2:
    image: mongo:7
    container_name: mongo2
    ports:
      - "27018:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo2_data:/data/db

  mongo3:
    image: mongo:7
    container_name: mongo3
    ports:
      - "27019:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo3_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
version: '3.9'

services:

  items-service:
    build: ./items-service
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
      - rabbitmq

  search-service:
    build: ./search-service
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
      - rabbitmq

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
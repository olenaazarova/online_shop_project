events {}

http {
  upstream auth_service {
    server auth-service-1:8000 max_fails=1 fail_timeout=5s;
    server auth-service-2:8000 max_fails=1 fail_timeout=5s;
    server auth-service-3:8000 max_fails=1 fail_timeout=5s;
  }

  upstream user_service {
    server user-service-1:8000 max_fails=1 fail_timeout=5s;
    server user-service-2:8000 max_fails=1 fail_timeout=5s;
    server user-service-3:8000 max_fails=1 fail_timeout=5s;
  }

  upstream payment_service {
    server payment-service-1:8008 max_fails=1 fail_timeout=5s;
    server payment-service-2:8008 max_fails=1 fail_timeout=5s;
    server payment-service-3:8008 max_fails=1 fail_timeout=5s;
  }

  upstream items_service {
    server items-service-1:8000 max_fails=1 fail_timeout=5s;
    server items-service-2:8000 max_fails=1 fail_timeout=5s;
    server items-service-3:8000 max_fails=1 fail_timeout=5s;
  }

  upstream search_service {
    server search-service:8001 max_fails=1 fail_timeout=5s;
  }

  server {
    listen 80;

    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;

    location /api/auth/ {
      proxy_pass http://auth_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/users/ {
      proxy_pass http://user_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/payments/ {
      rewrite ^/api/payments/(.*)$ /$1 break;
      proxy_pass http://payment_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/items/ {
      rewrite ^/api/items/(.*)$ /items/$1 break;
      proxy_pass http://items_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/search/ {
      rewrite ^/api/search/(.*)$ /search/$1 break;
      proxy_pass http://search_service;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
      return 200 "gateway ok\n";
    }
  }
}
